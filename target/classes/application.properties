spring.config.import=optional:file:.env,optional:file:./.env,optional:file:../.env

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/buildpro_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true


# Server Configuration
server.address=0.0.0.0
server.port=8081

# ── Tomcat Thread Pool Tuning ──────────────────────────────────────────────
# Increase from 200 (default) to 400 for concurrent checkout/product/AI load
server.tomcat.threads.max=400
# Always keep 20 warm threads ready (avoids cold-start latency on bursts)
server.tomcat.threads.min-spare=20
# Queue depth before new connections are refused (returns 503)
server.tomcat.accept-count=200
# Drop connections that don't complete a request within 20 seconds
server.tomcat.connection-timeout=20000


# Logging
logging.level.com.buildpro=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Thymeleaf Configuration (disable cache for development)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# OpenAPI/Swagger
springdoc.api-docs.path=${API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.tagsSorter=${SWAGGER_TAG_SORTER:alpha}
springdoc.swagger-ui.operationsSorter=${SWAGGER_OPERATION_SORTER:alpha}

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
# Razorpay Integration Credentials
# Replace these with your actual Razorpay keys
razorpay.key.id=${RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_SECRET}

# JWT Token Secret Config
jwt.secret=${JWT_SECRET}

# Mapbox Settings
mapbox.access.token=${MAPBOX_ACCESS_TOKEN}

# Forwarded Headers Strategy for SSL proxying
server.forward-headers-strategy=framework
name: Deploy Fullstack to EC2

on:
  push:
    branches:
      - model

jobs:
  deploy-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Model directory
        run: |
          set -e
          rm -rf deploy_stage
          mkdir -p deploy_stage

          if [ -d "Model" ]; then
            echo "Found folder: Model"
            cp -a Model/. deploy_stage/
          elif [ -d "model" ]; then
            echo "Found folder: model (lowercase)"
            cp -a model/. deploy_stage/
          elif [ -f "scheduler.py" ]; then
            echo "No Model folder; using repo root files"
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='deploy_stage' \
              ./ deploy_stage/
          else
            echo "ERROR: Could not find Model/, model/, or scheduler.py at repo root"
            exit 1
          fi

          echo "----- staged files -----"
          ls -la deploy_stage

      - name: Copy Model directory to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy_stage"
          target: "/home/ec2-user/Model"
          strip_components: 1
          overwrite: true

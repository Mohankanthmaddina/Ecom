name: Deploy Spring Boot Backend (Docker)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: find target -name "*.jar" -not -name "*.original" | head -1 | xargs -I {} mv {} target/ecom.jar

      - name: Copy Build Artifacts to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/ecom.jar,Dockerfile"
          target: "/home/ec2-user/backend/"
          strip_components: 0

      - name: Build and Run Backend Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,JWT_SECRET,DB_PASSWORD,RAZORPAY_KEY,RAZORPAY_SECRET,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,GEMINI_API_KEY,API_DOCS_PATH,SWAGGER_UI_PATH,SWAGGER_TAG_SORTER,SWAGGER_OPERATION_SORTER,MAPBOX_ACCESS_TOKEN
          script: |
            cd /home/ec2-user/backend/
            
            # Stop and remove existing container if present
            docker stop ecom-backend || true
            docker rm ecom-backend || true

            # Build fresh image
            docker build -t ecom-backend:latest .

            # Run new container connected to host network or custom bridge
            docker run -d \
              --name ecom-backend \
              --restart always \
              -p 8080:8080 \
              -e DB_URL="${DB_URL}" \
              -e DB_USERNAME="${DB_USERNAME}" \
              -e DB_PASSWORD="${DB_PASSWORD}" \
              -e RAZORPAY_KEY="${RAZORPAY_KEY}" \
              -e RAZORPAY_SECRET="${RAZORPAY_SECRET}" \
              -e MAIL_HOST="${MAIL_HOST}" \
              -e MAIL_PORT="${MAIL_PORT}" \
              -e MAIL_USERNAME="${MAIL_USERNAME}" \
              -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
              -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
              -e API_DOCS_PATH="${API_DOCS_PATH}" \
              -e SWAGGER_UI_PATH="${SWAGGER_UI_PATH}" \
              -e SWAGGER_TAG_SORTER="${SWAGGER_TAG_SORTER}" \
              -e SWAGGER_OPERATION_SORTER="${SWAGGER_OPERATION_SORTER}" \
              -e MAPBOX_ACCESS_TOKEN="${MAPBOX_ACCESS_TOKEN}" \
              -e JWT_SECRET="${JWT_SECRET}" \
              ecom-backend:latest

            echo "===== Backend Container Status ====="
            docker ps -f name=ecom-backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
          RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_DOCS_PATH: ${{ secrets.API_DOCS_PATH }}
          SWAGGER_UI_PATH: ${{ secrets.SWAGGER_UI_PATH }}
          SWAGGER_TAG_SORTER: ${{ secrets.SWAGGER_TAG_SORTER }}
          SWAGGER_OPERATION_SORTER: ${{ secrets.SWAGGER_OPERATION_SORTER }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
